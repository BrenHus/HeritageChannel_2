name: Build Mac Intel VST3

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

            - name: Configure Intel release
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DHERITAGE_BUILD_TESTS=ON
          -DCMAKE_C_FLAGS="-D__MAC_OS_X_VERSION_MAX_ALLOWED=140000"
          -DCMAKE_CXX_FLAGS="-D__MAC_OS_X_VERSION_MAX_ALLOWED=140000"

      - name: Build plug-in and tests
        run: cmake --build build --config Release --parallel 3

      - name: Run DSP tests
        run: ./build/HeritageDSPTests

      - name: Ad-hoc sign and package
        run: |
          plugin="build/HeritageChannel_artefacts/Release/VST3/Heritage Channel.vst3"
          codesign --force --deep --sign - "$plugin"
          mkdir -p package
          cp -R "$plugin" package/
          cp "scripts/Install Heritage Channel.command" package/
          cp INSTALL_MAC.md package/README-MAC.txt
          chmod +x "package/Install Heritage Channel.command"
          ditto -c -k --sequesterRsrc --keepParent package HeritageChannel-Mac-Intel.zip

      - name: Upload Mac package
        uses: actions/upload-artifact@v4
        with:
          name: HeritageChannel-Mac-Intel
          path: HeritageChannel-Mac-Intel.zip
